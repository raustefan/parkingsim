name: track parking

on:
  schedule:
    - cron: "2-59/5 * * * *"  # every 5 min, off the busy :00 mark; runs often start late
  workflow_dispatch:       # "Run workflow" button for manual tests

permissions:
  contents: write

concurrency: track  # never two runs pushing at once

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin  # runner is UTC otherwise; timestamps carry the offset either way
    steps:
      - uses: actions/checkout@v4
      - run: python3 track.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parking.csv
          git commit -m "data: $(date -Iminutes)"
          git push
