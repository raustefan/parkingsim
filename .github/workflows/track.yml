name: track parking

# Triggered every 5 min by cron-job.org via the API; GitHub's own schedule never fired for this repo.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: track  # never two runs pushing at once

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin  # runner is UTC otherwise; timestamps carry the offset either way
    steps:
      - uses: actions/checkout@v4
      - run: python3 track.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parking.csv wifi.csv
          git commit -m "data: $(date -Iminutes)"
          git pull --rebase  # someone may have pushed while we ran
          git push
